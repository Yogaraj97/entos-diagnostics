schema: spec-driven

context: "EntOS Diagnostics is a read-only C++17 AI2.0 utility. Retrieval stays in C++ with no shell scripts or subprocess collection. Separate Thunder, platform, and application collectors use common snapshots. Planned dependencies are libcurl and JsonCpp with optional native adapters. Neighboring repositories are analysis sources, not edit roots. Inventory all plugins but query only verified read-only bindings. Report field gaps, provenance, timestamps, inference, and target locality. Never output credentials, read DRM keys, mutate plugins, or claim unverified parity. Host tests do not prove target API or deployment correctness."

rules: {proposal: ["State current implementation status and non-goals."], specs: ["Define testable public behavior and unsupported/error cases."], design: ["Record API evidence, data ownership, privacy, and extension boundaries."], tasks: ["Separate host implementation, wire verification, and target release gates.", "Mark tasks complete only after focused verification."]}

