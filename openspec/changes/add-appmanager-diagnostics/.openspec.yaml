  ## Implementation Roadmap

  ### Phase 1: Host-Side Contracts ✅
  - [x] Document provider contracts in this spec (OpenSpec artifact)
  - [x] Add providers to config/providers.json (5 new entries)
  - [x] Add field mappings for each provider (ensure resultType match)
  - [x] Mark all as `enabled: false` and `verification: provisional`
  - [x] Add evidence URLs and test vector references

  ### Phase 2: Host Testing (Current)
  - [ ] Verify providers.json schema validation
  - [ ] Unit test: RPC client mock returns sample payloads for each provider
  - [ ] Unit test: AppCollector maps fields correctly (key paths, embedded JSON)
  - [ ] Host integration test: Run entos-diagnostics with mock Thunder server

  ### Phase 3: Device Verification (Gate for enablement)
  - [ ] Deploy to SKY/Xumo device and run live queries
  - [ ] Capture response shapes for all 5 methods (update evidence section)
  - [ ] Verify field paths are correct (no missing/extra nesting)
  - [ ] Update `verification: provisional` → `verification: verified` for each
  - [ ] Cross-check dumpsys output with diagnostic snapshot

  ### Phase 4: Production Release
  - [ ] Set `enabled: true` for verified providers
  - [ ] Merge providers.json changes to main
  - [ ] Update openspec config.yaml to reference this artifact
  - [ ] Add smoke test: CI runs entos-diagnostics on mock Thunder (success metric)

  **Status Tracking**:
  - Use `enabled: false` as gate until all Phase 3 verification is complete
  - Mark task as "blocked" if device access is unavailable
  - Document in-flight carrier requirements (e.g., SKY platform access) separately

  ## Verification Checklist

  **Before marking ANY provider as `verified`**:
  - [ ] Live response received from target device
  - [ ] All mapped fields present and type-correct
  - [ ] No unexpected fields cause parsing errors
  - [ ] Timestamp is from server (not collector clock)
  - [ ] Null/missing fields handled gracefully by collector

  **For each provider**:
  - app.loaded: [ ] yes [ ] no
  - app.installed: [ ] yes [ ] no
  - package.list: [ ] yes [ ] no
  - resource.stats: [ ] yes [ ] no
  - window.clients: [ ] yes [ ] no
