title: "AppManager Diagnostics Integration"

# Specification (proposal phase)
proposal: |
  ## Integration Goal
  Extend entos-diagnostics to expose AppManager JSON-RPC methods to diagnostic collectors,
  enabling retrieval of:
  - Loaded applications (lifecycle state, instance details)
  - Installed applications (app metadata, versions)
  - Application packages (storage, mount state)
  - Runtime metrics (memory, CPU per application)

  ## Current State
  - entos-diagnostics already has providers.json infrastructure for Thunder JSON-RPC bindings
  - AppManager exposes getLoadedApps, getInstalledApps over JSON-RPC @ org.rdk.AppManager
  - AppPackageManager exposes listPackages over JSON-RPC @ org.rdk.AppPackageManager
  - ResourceMonitor exposes GetStats for per-app resource usage
  - dumpsys.txt shows target data shape (installed app table, package cache)

  ## Non-Goals
  - Do NOT mutate AppManager or package manager state (read-only only)
  - Do NOT parse or validate raw DiagnosticsInterface output (separate concern)
  - Do NOT implement standalone shell helpers; stay in C++ with libcurl/JsonCpp
  - Do NOT claim API parity until wire contracts are verified on target

  ## Acceptance Criteria
  ✅ Add 5 new providers to config/providers.json with field mapping
  ✅ Define resultType and field contracts for each method
  ✅ Document evidence and verification status for each provider
  ✅ Create OpenSpec artifact for contract review (this file)
  ✅ Host-side implementation passes tests; target deployment gate pending

specs: |
  ## Provider Contracts

  ### Provider: app.loaded
  - **Callsign**: org.rdk.AppManager (fallback: org.rdk.AppManager.1)
  - **Method**: getLoadedApps
  - **Params**: {} (no arguments)
  - **Result Type**: object (JSON structure)
  - **Result Contract**:
    ```
    {
      "success": true,
      "loaded_apps": [
        {
          "appId": "string",
          "instanceId": "string",
          "state": "string", // e.g., "running", "paused", "stopped"
          "pid": number (optional)
        }
      ]
    }
    ```
  - **Evidence**: dumpsys.txt LOADED APPLICATIONS section shows appId + state
  - **Verification**: provisional (wire shape pending on target)
  - **Mapped Fields**:
    - `app.loaded.count` → loaded_apps array length
    - `app.loaded.summary` → JSON-serialized app list (embedded JSON)

  ### Provider: app.installed
  - **Callsign**: org.rdk.AppManager (fallback: org.rdk.AppManager.1)
  - **Method**: getInstalledApps
  - **Params**: {} (no arguments)
  - **Result Type**: object
  - **Result Contract**:
    ```
    {
      "success": true,
      "installed_apps": [
        {
          "appId": "string",
          "name": "string",
          "version": "string",
          "category": "string" (optional),
          "metadata": "string" (optional embedded JSON)
        }
      ]
    }
    ```
  - **Evidence**: dumpsys.txt PACKAGE MANAGER shows installed packages table
  - **Verification**: provisional (wire shape pending on target)
  - **Mapped Fields**:
    - `app.installed.count` → installed_apps array length
    - `app.installed.summary` → JSON-serialized app list (embedded JSON)

  ### Provider: package.list
  - **Callsign**: org.rdk.AppPackageManager (fallback: org.rdk.PackageManager)
  - **Method**: listPackages
  - **Params**: {} (no arguments)
  - **Result Type**: object
  - **Result Contract**:
    ```
    {
      "success": true,
      "packages": [
        {
          "name": "string",
          "version": "string",
          "size": "string",
          "installed": boolean,
          "type": "string" // e.g., "zip", "ralf"
        }
      ]
    }
    ```
  - **Evidence**: dumpsys.txt PACKAGE MANAGER Database and Cache sections
  - **Verification**: provisional (wire shape pending on target)
  - **Mapped Fields**:
    - `package.count` → packages array length
    - `package.cache.used` → cache size (if available)
    - `package.list` → JSON-serialized package list (embedded JSON)

  ### Provider: resource.stats
  - **Callsign**: org.rdk.ResourceMonitor
  - **Method**: GetStats
  - **Params**: {} (no arguments)
  - **Result Type**: object
  - **Result Contract**:
    ```
    {
      "success": true,
      "stats": [
        {
          "appId": "string",
          "cpu": number (percent or milliseconds),
          "memory": number (bytes),
          "timestamp": number (epoch seconds)
        }
      ]
    }
    ```
  - **Evidence**: dumpsys ResourceMonitor shows CPU/memory per process
  - **Verification**: provisional (wire shape pending on target)
  - **Mapped Fields**:
    - `resource.cpu.total` → sum of CPU across all apps
    - `resource.memory.total` → sum of memory across all apps
    - `resource.stats.summary` → JSON-serialized stats (embedded JSON)

  ### Provider: window.clients
  - **Callsign**: org.rdk.RDKWindowManager
  - **Method**: getApps
  - **Params**: {} (no arguments)
  - **Result Type**: object
  - **Result Contract**:
    ```
    {
      "success": true,
      "apps": [
        {
          "appId": "string",
          "zOrder": number (optional),
          "focused": boolean (optional),
          "visible": boolean (optional)
        }
      ]
    }
    ```
  - **Evidence**: RDKWindowManager plugin; shows app z-order and focus state
  - **Verification**: provisional (wire shape pending on target)
  - **Mapped Fields**:
    - `window.client.count` → apps array length
    - `window.focused.app` → appId where focused=true
    - `window.apps.summary` → JSON-serialized app list (embedded JSON)

design: |
  ## API Evidence & Ownership

  **Source of Truth**:
  - Thunder plugin schema: entservices-appmanagers/AppManager/AppManager.h (COM interface)
  - JSON-RPC test vectors: entservices-appmanagers/Tests/
  - Device telemetry: dumpsys.txt from target deployment

  **Data Ownership**:
  - AppManager instance owns app lifecycle state; queries are read-only
  - PackageManager instance owns package metadata; no mutations
  - ResourceMonitor owns per-app metrics; timestamps are server-side

  **Privacy & Security**:
  - No credentials, paths, or DRM keys leaked in any response
  - Automatic redaction of sensitive fields (authentication tokens, URLs with secrets)
  - All queries are read-only; no state modification possible

  **Extension Boundaries**:
  - New providers added to providers.json do NOT change C++ collector logic
  - Collector iterates providers generically; contracts are validated JSON-RPC-side
  - Field mapping is declarative; no hardcoded method names in AppCollector.cpp
  - If a callsign is unavailable, error is recorded; fallback is tried once

