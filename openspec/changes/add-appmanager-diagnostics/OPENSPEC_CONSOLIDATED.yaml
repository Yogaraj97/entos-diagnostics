title: "AppManager Human-Readable Diagnostics"
version: 2.0

proposal: |
  ## Goal
  Integrate AppManager JSON-RPC methods into entos-diagnostics with
  **human-readable table output** (no JSON) for dumpsys-compatible display.

  ## Scope
  Add 5 AppManager diagnostic providers that output clean, terminal-friendly
  tables instead of JSON, matching existing dumpsys format.

  ## Acceptance Criteria
  ✅ 5 providers integrated (loaded apps, installed apps, packages, resources, window state)
  ✅ Human-readable table format (no JSON output)
  ✅ Proper column alignment and section headers
  ✅ Summary statistics below each table
  ✅ Schema-driven configuration (providers.json)
  ✅ AppManagerFormatter class for table generation
  ✅ Device verification gates (enabled=false by default)

  ## Non-Goals
  ❌ JSON output (human-readable only)
  ❌ State mutations (read-only queries only)
  ❌ Real-time streaming (snapshot-based)
  ❌ Complex filtering (direct dumpsys approach)

specs: |
  ## 5 Diagnostic Providers

  ### 1. app.loaded (Loaded Applications)

  **Query:**
  ```
  org.rdk.AppManager.1.getLoadedApps()
  ```

  **Table Output:**
  ```
  LOADED APPLICATIONS:
  ===================
  App ID     | Instance ID  | State   | PID
  -----------+--------------+---------+-----
  netflix    | inst-001     | running | 1234
  youtube    | inst-002     | running | 5678
  
      Summary: 2 app(s) loaded
  ```

  **Table Columns:**
  - App ID: Application identifier
  - Instance ID: Unique instance
  - State: Application state (running, paused, stopped)
  - PID: Process ID

  **Configuration:**
  ```json
  {
    "id": "app.loaded",
    "section": "runtime",
    "callsigns": ["org.rdk.AppManager"],
    "operation": "getLoadedApps",
    "enabled": false
  }
  ```

  ---

  ### 2. app.installed (Installed Applications)

  **Query:**
  ```
  org.rdk.AppManager.1.getInstalledApps()
  ```

  **Table Output:**
  ```
  INSTALLED APPLICATIONS:
  =======================
  App ID    | Name       | Version      | Category
  ----------+------------+--------------+-------------
  netflix   | Netflix    | 100.140.1    | streaming
  youtube   | YouTube TV | 100.2.31     | streaming
  
      Summary: 2 app(s) installed
  ```

  **Table Columns:**
  - App ID: Package identifier
  - Name: Human-readable name
  - Version: Installed version
  - Category: App category

  ---

  ### 3. package.list (Package Inventory)

  **Query:**
  ```
  org.rdk.AppPackageManager.1.listPackages()
  ```

  **Table Output:**
  ```
  PACKAGE MANAGER:
  ================
  
      Cache Status:
          Used: 504 MB
          Limit: 100 MB
  
      Packages:
  
  Package Name | Version    | Size    | Type | Installed
  -------------+------------+---------+------+----------
  netflix      | 100.140.1  | 52 MB   | zip  | Yes
  youtube      | 100.2.31   | 11 MB   | zip  | Yes
  
      Summary: 2 package(s) in database
  ```

  **Cache Info:**
  - Used: Cache space used (MB)
  - Limit: Maximum cache (MB)

  **Package Columns:**
  - Package Name: Package ID
  - Version: Version string
  - Size: Installed size
  - Type: zip, ralf, etc.
  - Installed: Yes/No status

  ---

  ### 4. resource.stats (Resource Monitoring)

  **Query:**
  ```
  org.rdk.ResourceMonitor.1.GetStats()
  ```

  **Table Output:**
  ```
  RESOURCE MONITOR:
  =================
  
      Total Resources:
          CPU: 15.7%
          Memory: 2048 MB
  
      Per-Application Stats:
  
  App ID   | CPU (%)  | Memory (MB) | Timestamp
  ---------+----------+-------------+----------
  netflix  | 5.2      | 128         | 1730977661
  youtube  | 3.1      | 256         | 1730977661
  
      Summary: 2 app(s) monitored
  ```

  **Total Resources:**
  - CPU: Aggregate CPU %
  - Memory: Total memory (MB)

  **Per-App Columns:**
  - App ID: Application
  - CPU (%): CPU usage percentage
  - Memory (MB): Memory usage in MB
  - Timestamp: Server timestamp

  ---

  ### 5. window.clients (Window Manager State)

  **Query:**
  ```
  org.rdk.RDKWindowManager.1.getApps()
  ```

  **Table Output:**
  ```
  WINDOW MANAGER:
  ===============
  
      Focused Application: netflix
  
      Window Clients:
  
  App ID   | Z-Order | Focused | Visible
  ---------+---------+---------+--------
  netflix  | 100     | Yes     | Yes
  youtube  | 50      | No      | No
  
      Summary: 2 window client(s)
  ```

  **Focused App:**
  - Shows currently focused application

  **Window Columns:**
  - App ID: Application
  - Z-Order: Window stacking (higher = top)
  - Focused: Has input focus (Yes/No)
  - Visible: On screen (Yes/No)

  ---

design: |
  ## Implementation Architecture

  ### Components

  **AppManagerFormatter** (C++ class)
  - Converts JSON responses to human-readable tables
  - Methods: formatLoadedApps(), formatInstalledApps(), etc.
  - Handles column alignment, widths, summaries
  - No external dependencies (just stdio formatting)

  **AppManagerDumpsys** (C++ class)
  - Queries Thunder plugins via RPC
  - Integrates with entos-diagnostics main dumpsys
  - Routes output through AppManagerFormatter
  - Supports selective sections

  **Configuration** (providers.json)
  - Defines 5 providers with field mappings
  - Currently disabled (enabled=false)
  - Verification gates for device testing

  ### Data Flow

  ```
  entos-diagnostics dumpsys
           ↓
  CollectionEngine.collect()
           ↓
  AppCollector.collectApplication()
           ↓
  RpcClient.call() → Thunder plugins
           ↓
  Parse JSON responses
           ↓
  AppManagerFormatter.format*()
           ↓
  Human-readable table output
           ↓
  Terminal display
  ```

  ### Output Format Principles

  ✅ Human-first design (not machine-friendly)
  ✅ No JSON output (direct text tables)
  ✅ dumpsys-compatible formatting
  ✅ Column-based layout with separators
  ✅ Summary statistics below each section
  ✅ Clear section headers with status
  ✅ Consistent column widths
  ✅ `--` for missing/unavailable data

  ### Data Ownership & Privacy

  - Read-only queries only
  - No credential leakage
  - appId/metadata is application-public
  - Server-side timestamps (not device clock)

  ### Files

  ```
  include/entos/AppManagerFormatter.h      → Header
  src/application/AppManagerFormatter.cpp  → Implementation
  include/entos/AppManagerDumpsys.h        → Header
  src/application/AppManagerDumpsys.cpp    → Implementation (to create)
  config/providers.json                    → Configuration
  ```

